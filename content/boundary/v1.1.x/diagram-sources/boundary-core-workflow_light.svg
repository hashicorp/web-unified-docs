<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
  <title id="title">Boundary core workflow</title>
  <desc id="desc">Four stages show how Boundary authenticates a user, authorizes access, preserves existing client workflows, and provides passwordless access to a private target.</desc>
