      .accent { fill: #f04e52; }
      .line { fill: none; stroke: #a5aab3; stroke-width: 3; }
      .icon { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dark-icon { fill: none; stroke: #252a36; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
