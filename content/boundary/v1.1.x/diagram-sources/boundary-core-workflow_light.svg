    <rect class="panel" width="1120" height="250" rx="12"/>
    <text class="heading" x="42" y="64">Granular authorization</text>
    <text class="body" x="42" y="108"><tspan x="42">Boundary grants access based</tspan><tspan x="42" dy="29">on identity and policy.</tspan></text>
