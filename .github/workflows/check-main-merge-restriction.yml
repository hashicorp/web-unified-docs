name: 'Check Main Merge Restriction'

on:
  pull_request:
    branches:
      - main
    # Explicit types replace the defaults; include them plus label changes and
    # base-branch edits so the guard reruns when relevant PR state changes.
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions: {}

jobs:
  merge-guard:
    name: 'Check Main Merge Restriction'
    runs-on: ubuntu-latest
    steps:
      - name: Fail for blocked PRs targeting main
        if: contains(github.event.pull_request.labels.*.name, 'no-merge-to-main')
        run: |
          echo "::error title=Merge blocked::Remove the no-merge-to-main label before merging this PR into main."
          exit 1
