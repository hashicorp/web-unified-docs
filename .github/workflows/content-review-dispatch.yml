name: 'Content Review Dispatch'

on:
  pull_request:
    branches:
      - main
      - 'consul/**'
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  pull-requests: read
  contents: read

jobs:
  dispatch-content-reviews:
    name: 'Route Content Reviews'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > /tmp/changed_files.txt
          echo "Changed files:"
          cat /tmp/changed_files.txt

      - name: Parse config and route reviews
        id: route-reviews
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read config file
            const configPath = '.github/content-review-config.json';
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            
            // Read changed files
            const changedFilesPath = '/tmp/changed_files.txt';
            const changedFiles = fs.readFileSync(changedFilesPath, 'utf8').trim().split('\n').filter(f => f);
            
            console.log('Changed files:', changedFiles);
            console.log('Config entries:', config.reviews.length);
            
            // Find matching reviews
            const matchedReviews = [];
            
            for (const review of config.reviews) {
              // Check if any changed file matches any path pattern
              for (const pattern of review.paths) {
                // Simple glob matching: convert ** and * to regex
                const regexPattern = pattern
                  .replace(/\./g, '\\.')
                  .replace(/\*\*/g, '.*')
                  .replace(/\*/g, '[^/]*');
                const regex = new RegExp(`^${regexPattern}$`);
                
                const hasMatch = changedFiles.some(file => regex.test(file));
                
                if (hasMatch) {
                  console.log(`✓ Matched: ${review.name} (pattern: ${pattern})`);
                  matchedReviews.push(review);
                  break; // Don't add same review twice
                }
              }
            }
            
            // Store matched reviews as JSON for next step
            const matched = matchedReviews.map(r => ({
              name: r.name,
              workflow: r.workflow
            }));
            
            core.setOutput('matched-reviews', JSON.stringify(matched));
            core.setOutput('review-count', matched.length);
            
            if (matched.length === 0) {
              console.log('ℹ️ No content-specific reviews triggered for this PR');
            } else {
              console.log(`✓ Triggering ${matched.length} review workflow(s)`);
              matched.forEach(r => console.log(`  - ${r.name}: ${r.workflow}`));
            }

      - name: Trigger matched workflows
        if: fromJson(steps.route-reviews.outputs.matched-reviews) != null && steps.route-reviews.outputs.review-count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const matchedReviews = JSON.parse('${{ steps.route-reviews.outputs.matched-reviews }}');
            
            for (const review of matchedReviews) {
              console.log(`Triggering workflow: ${review.workflow}`);
              
              // Use workflow_dispatch to trigger the workflow
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: review.workflow,
                ref: context.ref,
                inputs: {
                  pull_number: context.payload.pull_request.number.toString()
                }
              });
            }

      - name: Log skipped (no reviews triggered)
        if: steps.route-reviews.outputs.review-count == '0'
        run: |
          echo "No content-specific reviews triggered for this PR"
