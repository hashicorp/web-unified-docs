name: 'Content Review Dispatch'

on:
  pull_request:
    branches:
      - main
      - 'consul/**'
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  pull-requests: read
  contents: read

jobs:
  dispatch-content-reviews:
    name: 'Route Content Reviews'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect content changes
        id: detect-content
        run: |
          # Get changed files
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > /tmp/changed_files.txt
          
          # Check for consul content changes
          if grep -q "^content/consul/" /tmp/changed_files.txt; then
            echo "has-consul-changes=true" >> $GITHUB_OUTPUT
          else
            echo "has-consul-changes=false" >> $GITHUB_OUTPUT
          fi
          
          # Log detected changes
          echo "Changed files:"
          cat /tmp/changed_files.txt

      - name: Route to Consul Review workflow
        if: steps.detect-content.outputs.has-consul-changes == 'true'
        uses: actions/workflow_dispatch@v4
        with:
          workflow: consul-content-review.yml
          ref: ${{ github.event.pull_request.head.ref }}

      - name: No content reviews triggered
        if: steps.detect-content.outputs.has-consul-changes == 'false'
        run: |
          echo "No content-specific reviews triggered for this PR"
